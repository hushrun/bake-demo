# Bakes this repository's compiled crates into layered images on GHCR, verifies the keyless
# signature from outside with cosign, and boots containers warm from the images.
#
# In GitHub Actions with no backend, `hushrun run` reuses and records nothing (B-31), so the job's
# store stays empty and a `--from store` bake has nothing to bake. Two bakes stand in:
# - bake:  CI's own, `--deps-only`, which compiles the third-party crates in a store of its own,
#          signed keylessly as this workflow, moving hushrun-linux-x64-latest.
# - store: the runner acting as a person's machine (HUSHRUN_PROVIDER=local): a build through
#          hushrun fills its store, and `--from store` bakes the full store, unsigned, under its
#          fixed tag and hushrun-linux-x64-branch-main-latest.
name: bake

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Two bakes of one repository at once race for the moving tags (B-65): one run at a time.
concurrency:
  group: bake
  cancel-in-progress: false

env:
  # No hosted backend: results and compiled code stay on the runner.
  HUSHRUN_BACKEND: ""
  HUSHRUN_NO_UPDATE_CHECK: "1"
  HUSHRUN_REV: 623f73285383bb2d8dbd651f1e442a6eb086acbd
  IMAGE: ghcr.io/hushrun/bake-demo
  RUST_IMAGE: rust:1.94.0-trixie

defaults:
  run:
    shell: bash

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the hushrun binary
        id: hushrun-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/hushrun
          key: hushrun-bin-${{ runner.os }}-${{ env.HUSHRUN_REV }}-rust-1.94.0

      - name: Install hushrun
        if: steps.hushrun-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/hushrun/hushrun --rev "$HUSHRUN_REV" hushrun

      - name: Toolchain
        run: |
          hushrun --version
          rustc -vV
          ldd --version 2>/dev/null | sed -n 1p || true

      - name: The CI build through hushrun (reuses nothing here, B-31)
        run: |
          HUSHRUN_BUILD=on hushrun run build -- cargo build --release --locked 2>&1 | tee "$RUNNER_TEMP/ci-build.log"
          hushrun build status 2>&1 | tee -a "$RUNNER_TEMP/ci-build.log"

      - name: Bake the third-party crates, signed keylessly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          start=$(date +%s.%N)
          hushrun build bake --deps-only --oci "$IMAGE" -- cargo build --release --locked 2>&1 | tee "$RUNNER_TEMP/bake.log"
          echo "bake wall seconds: $(echo "$(date +%s.%N) - $start" | awk '{print $1 - $3}')" | tee -a "$RUNNER_TEMP/bake.log"

      - name: Keep the binary and the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp ~/.cargo/bin/hushrun "$RUNNER_TEMP/out/" || true
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/out/" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bake
          path: ${{ runner.temp }}/out

  store:
    needs: bake
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The runner as a person's machine: its own store, the build mode HUSHRUN_BUILD sets.
      HUSHRUN_PROVIDER: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: bake
          path: ${{ runner.temp }}/bake

      - name: Install hushrun
        run: sudo install -m 0755 "$RUNNER_TEMP/bake/hushrun" /usr/local/bin/hushrun

      - name: Build through hushrun
        run: |
          start=$(date +%s.%N)
          HUSHRUN_BUILD=on hushrun run build -- cargo build --release --locked 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "build wall seconds: $(echo "$(date +%s.%N) - $start" | awk '{print $1 - $3}')" | tee -a "$RUNNER_TEMP/build.log"
          hushrun build status 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          hushrun build manifest 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Bake the store and publish it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --force: publish every push, even within the hour of the last image (B-66's hold).
          start=$(date +%s.%N)
          hushrun build bake --from store --oci "$IMAGE" --branch-tag --force 2>&1 | tee "$RUNNER_TEMP/store-bake.log"
          echo "bake wall seconds: $(echo "$(date +%s.%N) - $start" | awk '{print $1 - $3}')" | tee -a "$RUNNER_TEMP/store-bake.log"

      - name: What the store saves on this runner
        continue-on-error: true
        run: hushrun build bake --from store --out "$RUNNER_TEMP/report-store" --report -- cargo build --release --locked 2>&1 | tee "$RUNNER_TEMP/report.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: store
          path: ${{ runner.temp }}/*.log

  verify:
    needs: bake
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDENTITY: ^https://github\.com/hushrun/bake-demo/\.github/workflows/bake\.yml@refs/heads/main$
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: bake
          path: ${{ runner.temp }}/bake

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Verify the image's attestation with cosign
        run: |
          set -x
          cosign version
          raw=$(docker buildx imagetools inspect --raw "$IMAGE:hushrun-linux-x64-latest")
          digest="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_ENV"
          printf '%s' "$raw" | jq '{mediaType, layers: [.layers[] | {digest, size, role: .annotations["dev.hushrun.layer"]}]}'
          cosign verify-attestation --new-bundle-format --insecure-ignore-tlog \
            --type https://hushrun.com/attestations/baked-image/v1 \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE@$digest" > "$RUNNER_TEMP/image-attestation.json"
          head -1 "$RUNNER_TEMP/image-attestation.json" | jq -r '.payload' | base64 -d | jq . || head -c 3000 "$RUNNER_TEMP/image-attestation.json"

      - name: The same check must fail for another identity
        run: |
          if cosign verify-attestation --new-bundle-format --insecure-ignore-tlog \
            --type https://hushrun.com/attestations/baked-image/v1 \
            --certificate-identity-regexp '^https://github\.com/hushrun/bake-demo/\.github/workflows/bake\.yml@refs/heads/other$' \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE@$digest" > /dev/null; then
            echo "verified for the wrong identity"; exit 1
          fi
          echo "refused for the wrong identity, as it should be"

      - name: Pull the store and verify baked.json's attestation
        run: |
          set -x
          docker pull "$IMAGE@$digest"
          docker create --name hushrun-snap-gh-store "$IMAGE@$digest" /none
          docker cp hushrun-snap-gh-store:/hushrun "$RUNNER_TEMP/pulled"
          docker rm hushrun-snap-gh-store
          ls -la "$RUNNER_TEMP/pulled"
          du -sh "$RUNNER_TEMP/pulled"
          jq 'del(.packs, .rows)' "$RUNNER_TEMP/pulled/baked.json"
          cosign verify-blob-attestation --new-bundle-format --insecure-ignore-tlog \
            --bundle "$RUNNER_TEMP/pulled/baked.sigstore.json" \
            --type https://hushrun.com/attestations/baked-store/v1 \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$RUNNER_TEMP/pulled/baked.json"

      - name: hushrun reads the pulled store
        run: |
          sudo install -m 0755 "$RUNNER_TEMP/bake/hushrun" /usr/local/bin/hushrun
          chmod -R go-w "$RUNNER_TEMP/pulled"
          HUSHRUN_BUILD_LOWER="$RUNNER_TEMP/pulled" hushrun build status
          HUSHRUN_BUILD_LOWER="$RUNNER_TEMP/pulled" hushrun build status --format json | jq '.baked // .'

  boot:
    # GitHub's runner stands in for a sandbox provider: containers started from images with a
    # baked store, against the same container with none.
    needs: store
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: bake
          path: ${{ runner.temp }}/bake

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: The images' layout
        run: |
          for tag in hushrun-linux-x64-latest hushrun-linux-x64-branch-main-latest; do
            echo "== $tag"
            raw=$(docker buildx imagetools inspect --raw "$IMAGE:$tag")
            echo "digest sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
            printf '%s' "$raw" | jq -c '.layers[] | {role: .annotations["dev.hushrun.layer"], size, digest}'
          done

      - name: Build the images
        run: |
          ctx="$RUNNER_TEMP/ctx"
          mkdir -p "$ctx"
          cp -a "$GITHUB_WORKSPACE" "$ctx/repo"
          install -m 0755 "$RUNNER_TEMP/bake/hushrun" "$ctx/hushrun"
          install -m 0755 ci/boot.sh "$ctx/boot.sh"
          base='COPY hushrun /usr/local/bin/hushrun
          COPY repo /home/runner/work/bake-demo/bake-demo
          COPY boot.sh /boot.sh
          ENV HUSHRUN_BACKEND="" HUSHRUN_HOST=http://127.0.0.1:9 HUSHRUN_NO_UPDATE_CHECK=1'
          printf 'FROM %s\n%s\n' "$RUST_IMAGE" "$base" > "$ctx/Dockerfile.cold"
          # The keyless, dependencies-only image: trusted by the signer hushrun.yaml names.
          printf 'FROM %s\nCOPY --from=%s:hushrun-linux-x64-latest /hushrun /hushrun\n%s\n' "$RUST_IMAGE" "$IMAGE" "$base" > "$ctx/Dockerfile.deps"
          # The full store, unsigned: read on the person's say-so, as a store from a machine is.
          printf 'FROM %s\nCOPY --from=%s:hushrun-linux-x64-branch-main-latest /hushrun /hushrun\n%s\nENV HUSHRUN_BUILD_LOWER_UNTRUSTED=1\n' "$RUST_IMAGE" "$IMAGE" "$base" > "$ctx/Dockerfile.full"
          sed -i 's/^ *//' "$ctx"/Dockerfile.*
          for v in cold deps full; do echo "== Dockerfile.$v"; cat "$ctx/Dockerfile.$v"; docker build -q -t "hushrun-snap-gh-$v" -f "$ctx/Dockerfile.$v" "$ctx"; done

      - name: Boot cold, warm from the dependencies, warm from the full store
        run: |
          for v in cold deps full; do
            echo "::group::$v"
            start=$(date +%s.%N)
            docker run --rm --name "hushrun-snap-gh-$v" "hushrun-snap-gh-$v" /boot.sh 2>&1 | tee "$RUNNER_TEMP/$v.log"
            echo "container wall seconds: $(echo "$(date +%s.%N) - $start" | awk '{print $1 - $3}')" | tee -a "$RUNNER_TEMP/$v.log"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          for v in cold deps full; do
            { echo "### $v"; echo '```'; grep -E 'hushrun: build|baked|wall seconds|Finished' "$RUNNER_TEMP/$v.log" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: boot
          path: ${{ runner.temp }}/*.log
